<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array — Side Screenprinting Hustle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              array: {
                bg: "#EADFFF",
                grid: "#795ADF",
                purple: "#2A107E",
                purpleMuted: "#795ADF",
                green: "#52EE9B",
                red: "#FF625A",
                cyan: "#02BACE",
                yellow: "#FBBD00",
              },
            },
            fontFamily: {
              sans: [
                "ui-sans-serif",
                "system-ui",
                "-apple-system",
                "Segoe UI",
                "Roboto",
                "Helvetica Neue",
                "Arial",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@xyflow/react@12.3.6/dist/style.css"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      .array-flow-wrap {
        --xy-background-color: #eadfff;
        --xy-background-pattern-color: #795adf;
        --xy-background-pattern-dots-color: #795adf;
      }
      .array-flow-wrap .react-flow__background-pattern.dots {
        fill: #795adf;
      }
    </style>
  </head>
  <body class="bg-[#EADFFF] antialiased text-slate-800">
    <div id="root"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
